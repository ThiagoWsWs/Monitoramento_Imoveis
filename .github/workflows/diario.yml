name: Monitor de aluguéis diário

on:
  schedule:
    # 10:45 UTC = 07:45 em Brasília. O GitHub costuma atrasar alguns minutos
    # e a busca leva ~3 min, então a mensagem chega por volta das 08:00.
    - cron: "45 10 * * *"
  workflow_dispatch: {}   # botão "Run workflow" para rodar na hora

permissions:
  contents: write         # para salvar o histórico (dados/vistos.json)

concurrency:
  group: monitor-imoveis
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar imóveis e enviar no Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Salvar histórico de anúncios já enviados
        if: always()
        run: |
          git config user.name "monitor-imoveis[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/vistos.json || true
          git diff --cached --quiet || git commit -m "Atualiza anúncios vistos ($(date -u +%F))"
          git push
